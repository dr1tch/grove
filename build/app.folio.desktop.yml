app-id: app.folio.desktop
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: folio
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --filesystem=host
  - --share=network
  - --socket=pulseaudio
modules:
  - name: folio
    buildsystem: simple
    build-commands:
      - cp -r . /app/folio
      - install -Dm755 folio-launch /app/bin/folio
      - install -Dm644 app.folio.desktop.desktop /app/share/applications/app.folio.desktop.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/app.folio.desktop.png
    sources:
      - type: dir
        path: ../release/linux-unpacked
      - type: file
        path: folio-launch
      - type: file
        path: app.folio.desktop.desktop
      - type: file
        path: icon.png
