name: APT repository

# Publishes the latest release's .deb as a signed APT repository on GitHub Pages,
# so Debian/Ubuntu users can `sudo apt install folio` and get updates with `apt upgrade`.
# Needs the APT_GPG_KEY secret (an armored private signing key) and Pages set to "GitHub Actions".
on:
  # runs on the default branch, which the github-pages environment allows (tag refs are not)
  workflow_run:
    workflows: [Release, Check]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.name == 'Release' || github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vite+
        run: curl -fsSL https://vite.plus | VP_NODE_MANAGER=no bash
      - name: Build Grove website and account pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$VITE_TURNSTILE_SITE_KEY"
          . "$HOME/.config/vite-plus/env"
          vp install --frozen-lockfile
          vp run '@grove/landing#build'
          vp run '@grove/web#build'
          mkdir -p site/app
          cp -a out/landing/. site/
          cp -a out/web/. site/app/
      - name: Download the latest release's .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir site/pool
      - name: Build and sign the repository
        working-directory: site
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          apt-ftparchive packages pool > Packages
          gzip -k9 Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin=grove -o APT::FTPArchive::Release::Label=grove release . > Release
          gpg --batch --import <<< "$APT_GPG_KEY"
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --armor --export > grove.asc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
